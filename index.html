<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Saqlain Siddiqi">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="copyright" content="© 2026 Saqlain Siddiqi. All rights reserved.">
<title>An Ode to the Dead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://s3.amazonaws.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="assets/site.css?v=5">
<style>
/* Front page: a site key plan. The valley as a 3D massing model fills the screen; the title and site index float on the left,
   a drawing-sheet frame with north point, coordinates and title block sits around it. */
:root{
  --paper:#ecebe6; --paper2:#e2e0d8; --ink:#1d1d1f; --ink2:#6e6e73; --rule:rgba(29,29,31,.16);
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --paper:#141518; --paper2:#0d0e10; --ink:#f5f5f7; --ink2:#98989d; --rule:rgba(245,245,247,.14) }}
:root[data-theme="dark"]{ --paper:#141518; --paper2:#0d0e10; --ink:#f5f5f7; --ink2:#98989d; --rule:rgba(245,245,247,.14) }

body{overflow:hidden;background:var(--paper)}
#map{position:fixed;inset:0;background:radial-gradient(ellipse 80% 70% at 60% 50%, var(--paper) 0%, var(--paper2) 100%)}
.veil{position:fixed;inset:0;z-index:2;background:var(--paper);pointer-events:none;transition:opacity 1.6s var(--ease)}
body.ready .veil{opacity:0}

/* a paper fade behind the left column, so the title and index read over the map */
.fade{position:fixed;z-index:1;top:0;bottom:0;left:0;width:min(640px,60vw);pointer-events:none;
  background:linear-gradient(90deg,color-mix(in srgb,var(--paper) 88%,transparent) 0%,color-mix(in srgb,var(--paper) 55%,transparent) 55%,transparent 100%)}
@media (max-width:760px){.fade{width:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--paper) 85%,transparent) 0%,transparent 34%,transparent 60%,color-mix(in srgb,var(--paper) 80%,transparent) 100%)}}

/* drawing-sheet frame */
.frame{position:fixed;z-index:3;inset:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  border:.5px solid var(--rule);pointer-events:none;opacity:0;transition:opacity 1.2s var(--ease) .4s}
.frame::before,.frame::after{content:"";position:absolute;width:14px;height:14px;border:solid var(--ink);opacity:.5}
.frame::before{left:-1px;top:-1px;border-width:1.5px 0 0 1.5px}
.frame::after{right:-1px;bottom:-1px;border-width:0 1.5px 1.5px 0}
body.ready .frame{opacity:1}

/* left: title and site index */
.panel{position:fixed;z-index:4;top:max(40px,calc(env(safe-area-inset-top,0px) + 28px));left:max(40px,calc(env(safe-area-inset-left,0px) + 28px));bottom:40px;width:min(400px,calc(100% - 80px));
  display:flex;flex-direction:column;gap:28px;pointer-events:none}
.panel > *{pointer-events:auto}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin:0 0 18px}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(40px,5.2vw,64px);line-height:.98;letter-spacing:-.035em;margin:0;color:var(--ink)}
h1 span{display:block}
h1 em{font-style:normal;font-weight:300;color:var(--ink2)}
.lede{margin:18px 0 0;font-size:15px;line-height:1.5;color:var(--ink2);max-width:34ch}
.about{display:inline-block;margin-top:12px;font-size:13px;font-weight:500;color:var(--tint);text-decoration:none}
.about:hover{text-decoration:underline}
.reveal{opacity:0;transform:translateY(18px);filter:blur(8px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease),filter 1.1s var(--ease)}
body.ready .reveal{opacity:1;transform:none;filter:none}
body.ready .reveal.d1{transition-delay:.25s} body.ready .reveal.d2{transition-delay:.4s} body.ready .reveal.d3{transition-delay:.6s}

.index{margin:auto 0 0;display:flex;flex-direction:column;gap:10px;list-style:none;padding:0}
.index li{opacity:0;transform:translateX(-24px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
body.landed .index li{opacity:1;transform:none}
body.landed .index li:nth-child(2){transition-delay:.12s} body.landed .index li:nth-child(3){transition-delay:.24s}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start;width:100%;text-align:left;padding:16px 18px;border-radius:18px;cursor:pointer;
  color:var(--label);transition:transform .35s var(--ease),background .3s,box-shadow .3s}
.card:hover{transform:translateX(4px)}
.card .no{grid-row:1/3;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--mark);padding-top:3px}
.card h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.card .meta{font-size:13px;color:var(--label2)}
.card{text-decoration:none}
.card .go{grid-column:2;display:none;flex-direction:column;gap:8px;margin-top:10px;padding-top:12px;border-top:.5px solid var(--hair)}
.card .go small{font-size:12px;font-weight:500;color:var(--tint)}
.card .go i{display:block;height:2px;border-radius:1px;background:var(--fill2);overflow:hidden}
.card .go i::after{content:"";display:block;height:100%;width:0;background:var(--tint);transition:width var(--enter,2s) linear}
.card.on{background:var(--glass-strong)}
.card.on .go{display:flex}
.card.on .go i::after{width:100%}
.foot{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);margin:0}
.foot a{color:var(--tint);text-decoration:none}
.foot a:hover{text-decoration:underline}

/* site markers: a dimension-style leader with a tag */
.sm{position:absolute;top:0;left:0;z-index:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;will-change:transform}
.sm > *{opacity:0;transform:translateY(10px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
body.landed .sm > *{opacity:1;transform:none}
/* the tag moves every frame, so it takes a near-opaque fill rather than re-blurring the map behind it */
.sm-tag.glass{background:var(--glass-strong);-webkit-backdrop-filter:none;backdrop-filter:none}
.sm-tag{display:flex;align-items:center;padding:4px;border-radius:999px;white-space:nowrap;font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--label);transition:transform .35s var(--ease),padding .35s var(--ease)}
/* the map shows only the number; the name opens beside it when the site or its card is pointed at, or the site is chosen */
.sm-tag span{display:block;max-width:0;opacity:0;overflow:hidden;transition:max-width .4s var(--ease),opacity .3s var(--ease),margin .4s var(--ease)}
.sm:hover .sm-tag,.sm.hot .sm-tag,.sm.on .sm-tag{padding-right:12px}
.sm:hover .sm-tag span,.sm.hot .sm-tag span,.sm.on .sm-tag span{max-width:240px;opacity:1;margin-left:8px}
.sm-tag b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-size:10.5px;font-weight:500;transition:background .3s}
.sm-stem{width:1px;height:var(--stem,46px);background:linear-gradient(var(--ink),color-mix(in srgb,var(--ink) 15%,transparent))}
.sm-dot{width:9px;height:9px;margin-top:-4px;border-radius:50%;background:var(--mark);box-shadow:0 0 0 3px color-mix(in srgb,var(--mark) 30%,transparent)}
body.landed .sm:hover .sm-tag,body.landed .sm.hot .sm-tag{transform:translateY(-3px)}
.sm:hover .sm-tag b,.sm.hot .sm-tag b,.sm.on .sm-tag b{background:var(--mark);color:#fff}
body.landed .sm.dim > *{opacity:.3}

/* bottom right: north point */
.hud{position:fixed;z-index:4;right:max(40px,calc(env(safe-area-inset-right,0px) + 28px));bottom:40px;display:flex;align-items:flex-end;gap:12px;pointer-events:none;
  opacity:0;transition:opacity 1s var(--ease) .6s}
body.ready .hud{opacity:1}
.north{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.north svg{width:34px;height:34px;overflow:visible}
  opacity:0;pointer-events:none;transform:translateY(-8px);transition:opacity .4s var(--ease),transform .4s var(--ease)}

/* map controls and attribution, quietened */
.maplibregl-ctrl-scale{background:transparent;border-color:var(--ink2);color:var(--ink2);font-family:var(--f-mono);font-size:10px;letter-spacing:.04em}
.maplibregl-ctrl-attrib{background:var(--glass)!important;color:var(--ink2)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--ink2)!important}
.maplibregl-ctrl-bottom-right{bottom:112px;right:max(40px,calc(env(safe-area-inset-right,0px) + 28px));display:flex;flex-direction:column;align-items:flex-end}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl{margin:0 0 8px}

/* no WebGL, or the map failed: the page still works as an index */
body.nomap .frame,body.nomap .hud{display:none}
body.nomap .index li,body.nomap .reveal{opacity:1;transform:none;filter:none}

@media (max-width:760px){
  .panel{left:20px;right:20px;width:auto;top:max(28px,calc(env(safe-area-inset-top,0px) + 20px));bottom:max(20px,env(safe-area-inset-bottom,0px));gap:16px}
  h1{font-size:38px}
  .eyebrow{font-size:10px;letter-spacing:.1em;margin-right:64px}
  .lede,.foot{display:none}
  .index{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:auto -20px 0;padding:0 20px 4px;scrollbar-width:none}
  .index::-webkit-scrollbar{display:none}
  .index li{flex:0 0 84%;scroll-snap-align:center}
  .card{height:100%}
  .card:hover{transform:none}
  .hud{top:max(28px,calc(env(safe-area-inset-top,0px) + 20px));bottom:auto;right:20px}
    .maplibregl-ctrl-scale{display:none}
  .maplibregl-ctrl-bottom-right{bottom:auto;top:96px;right:20px}
}
@media (prefers-reduced-motion:reduce){
  .veil,.frame,.reveal,.index li,.sm > *,.card,.hud{transition:none!important}
}
</style>
</head>
<body>
<div id="map" aria-label="3D map of the Kashmir valley showing the three graveyards"></div>
<div class="fade"></div>
<div class="veil"></div>
<div class="frame" aria-hidden="true"></div>

<section class="panel">
  <header>
    <p class="eyebrow reveal">Heritage documentation · Kashmir</p>
    <h1 class="reveal d1"><span>An Ode</span><span><em>to the</em> Dead</span></h1>
    <p class="lede reveal d2" id="lede"></p>
    <a class="about reveal d2" href="context.html">About the archive →</a>
  </header>
  <ol class="index" id="index" aria-label="The three graveyards"></ol>
  <p class="foot reveal d3"><span id="credit"></span><span>© 2026 Saqlain Siddiqi. All rights reserved.</span></p>
</section>


<div class="hud" aria-hidden="true">
  <div class="north glass"><svg id="needle" viewBox="0 0 34 34"><path d="M17 4 21.5 17h-9Z" fill="var(--ink)"/><path d="M17 30 21.5 17h-9Z" fill="none" stroke="var(--ink)" stroke-width="1"/></svg></div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="assets/archive.js?v=18"></script>
<script src="assets/map.js?v=8"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const theme = new URLSearchParams(location.search).get('theme');   // ?theme=light or dark, to preview either
if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobile = () => innerWidth <= 760;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('lede').textContent = `${ARCHIVE.project}.`;
$('credit').textContent = `${ARCHIVE.institution} · Funded by ${ARCHIVE.funder}`;

/* ---------- site index ---------- */
const sites = ARCHIVE.sites.filter(s => s.lat);
$('index').innerHTML = sites.map((s, i) => {
  const graves = s.zones.reduce((a, z) => a + z.graves.length, 0);
  return `<li><a class="card glass" href="${Archive.siteURL(s)}" data-i="${i}">
    <span class="no">${String(i + 1).padStart(2, '0')}</span>
    <h2>${esc(s.name)}</h2>
    <span class="meta">${esc(s.place)} · ${graves ? `${graves} graves` : `${s.zones.length} zone${s.zones.length > 1 ? 's' : ''}`}</span>
    <span class="go"><small>Entering site</small><i></i></span>
  </a></li>`;
}).join('');
const cards = [...document.querySelectorAll('.card')];

/* ---------- the map: the valley as a massing model (assets/map.js) ---------- */
const palette = MapKit.palette, style = MapKit.style;
const VALLEY = { center: [74.74, 34.16], zoom: 8.3, pitch: 0, bearing: 0 };
const PLACES = ['Srinagar', 'Ganderbal', 'Sumbal'], WATERS = ['Wular Lake', 'Dal Lake'];   // only the names that locate the three sites
let map;
try {
  map = new maplibregl.Map({ container: 'map', style: style(palette(), { places: PLACES, waters: WATERS }), ...VALLEY, maxPitch: 75, attributionControl: { compact: true },
    canvasContextAttributes: { antialias: true } });
} catch (e) { document.body.classList.add('nomap', 'ready', 'landed'); return; }
map.addControl(new maplibregl.ScaleControl({ maxWidth: 110, unit: 'metric' }), 'bottom-right');
const failTimer = setTimeout(() => { if (!map.loaded()) document.body.classList.add('nomap', 'ready', 'landed'); }, 12000);

/* site highlights: a soft disc on the ground at each site, with a ring breathing outward */
const STOPS = [[8, 7], [12, 16], [14, 22], [16, 50], [18, 200]];   // px; from z16 up this is about 100 m on the ground
const radius = k => ['interpolate', ['exponential', 2], ['zoom'], ...STOPS.flatMap(([z, r]) => [z, r * k])];
const R = radius(1);
function addSiteLayers(){
  const c = palette();
  map.addSource('sites', { type: 'geojson', data: { type: 'FeatureCollection',
    features: sites.map((s, i) => ({ type: 'Feature', properties: { i }, geometry: { type: 'Point', coordinates: [s.lng, s.lat] } })) } });
  map.addLayer({ id: 'site-disc', type: 'circle', source: 'sites',
    paint: { 'circle-radius': R, 'circle-color': c.mark, 'circle-opacity': .16, 'circle-blur': .5, 'circle-pitch-alignment': 'map' } });
  map.addLayer({ id: 'site-ring', type: 'circle', source: 'sites',
    paint: { 'circle-radius': R, 'circle-color': 'rgba(0,0,0,0)', 'circle-stroke-color': c.mark, 'circle-stroke-width': 1.2, 'circle-stroke-opacity': .8, 'circle-pitch-alignment': 'map' } });
}
function pulse(now){
  if (!map.getLayer('site-ring')) return;
  const t = (now % 2600) / 2600;
  map.setPaintProperty('site-ring', 'circle-radius', radius(1 + t));
  map.setPaintProperty('site-ring', 'circle-stroke-opacity', .85 * (1 - t));
  requestAnimationFrame(pulse);
}

/* markers: a leader line rising from the site to a numbered tag; Madeen Sahab sits 2 km from Hassanabad, so its leader is taller.
   Placed by hand on each render rather than as maplibregl.Marker: a Marker moves a frame behind the map and, over terrain, reads the
   depth buffer back from the GPU to test whether hills cover it, which stalls the orbit. These sit in the valley floor and are never covered. */
const STEMS = [46, 104, 46];
const markers = sites.map((s, i) => {
  const el = document.createElement('div'); el.className = 'sm'; el.style.setProperty('--stem', (STEMS[i] || 46) + 'px');
  el.innerHTML = `<div class="sm-tag glass"><b>${String(i + 1).padStart(2, '0')}</b><span>${esc(s.name)}</span></div><i class="sm-stem"></i><i class="sm-dot"></i>`;
  [...el.children].forEach((c, k) => c.style.transitionDelay = (.18 * i + .08 * (2 - k)) + 's');
  el.addEventListener('click', e => { e.stopPropagation(); focus(i); });
  el.addEventListener('mouseenter', () => hot(i)); el.addEventListener('mouseleave', () => hot(null));
  map.getCanvasContainer().appendChild(el);
  return el;
});
function placeMarkers(){
  sites.forEach((s, i) => { const p = map.project([s.lng, s.lat]); markers[i].style.transform = `translate3d(${p.x}px,${p.y}px,0) translate(-50%,-100%)`; });
}
map.on('render', placeMarkers);
function hot(i){ markers.forEach((m, j) => m.classList.toggle('hot', j === i)); }

/* camera: the overview frames the three sites; focusing flies low over one */
function overview(){
  const b = new maplibregl.LngLatBounds(); sites.forEach(s => b.extend([s.lng, s.lat]));
  const pad = mobile() ? { top: 150, bottom: 260, left: 40, right: 40 } : { top: 160, bottom: 160, left: Math.min(500, innerWidth * .38), right: 160 };
  const cam = map.cameraForBounds(b, { padding: pad, bearing: -22 }) || { center: VALLEY.center, zoom: 10 };
  return { center: cam.center, zoom: cam.zoom - .2, bearing: -22, pitch: 56 };
}
const FOCUS = [{ bearing: -32, pitch: 62, zoom: 15.9 }, { bearing: 28, pitch: 60, zoom: 15.9 }, { bearing: -12, pitch: 58, zoom: 14.6 }];
let focused = -1;
const ENTER_MS = 2200;
function focus(i){
  if (focused === i) return;
  focused = i; stopOrbit();
  cards.forEach((c, j) => c.classList.toggle('on', j === i));
  markers.forEach((m, j) => { m.classList.toggle('dim', j !== i); m.classList.toggle('on', j === i); });
  const s = sites[i], url = Archive.siteURL(s), ms = reduced ? 0 : ENTER_MS;
  document.documentElement.style.setProperty('--enter', ms + 'ms');
  if (mobile()) cards[i].scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
  map.flyTo({ ...MapKit.entry(s), duration: ms, curve: 1.4, essential: true });
  // carry straight on into the site, which opens on this same view
  map.once('moveend', () => { if (focused === i) location.href = url; });
}
function showAll(){
  focused = -1; cards.forEach(c => c.classList.remove('on')); markers.forEach(m => m.classList.remove('dim', 'on'));
  document.body.classList.remove('focused');
  map.flyTo({ ...overview(), duration: reduced ? 0 : 2800, curve: 1.3, essential: true });
  map.once('moveend', () => setTimeout(startOrbit, 600));
}
cards.forEach((c, i) => {
  c.addEventListener('click', e => { if (e.metaKey || e.ctrlKey || e.shiftKey || !map) return; e.preventDefault(); focus(i); });
  c.addEventListener('mouseenter', () => hot(i)); c.addEventListener('mouseleave', () => hot(null));
});
addEventListener('keydown', e => { if (e.key === 'Escape' && focused >= 0) showAll(); });

/* a slow drift around the overview; it gives way while someone has the controls and picks up again once they let go */
let orbiting = false, last = 0, resume = 0;
function startOrbit(){ if (reduced || focused >= 0 || orbiting) return; orbiting = true; last = performance.now(); requestAnimationFrame(orbit); }
function stopOrbit(){ orbiting = false; }
function orbit(now){
  if (!orbiting) return;
  const dt = Math.min(now - last, 64); last = now;
  if (!map.isMoving()) map.setBearing(map.getBearing() + dt * .0022);
  requestAnimationFrame(orbit);
}
['mousedown', 'touchstart', 'wheel'].forEach(t => map.getCanvas().addEventListener(t, () => {
  stopOrbit(); clearTimeout(resume); resume = setTimeout(startOrbit, 8000);
}, { passive: true }));

/* the north point follows the view */
function readout(){ $('needle').style.transform = `rotate(${-map.getBearing()}deg)`; }
map.on('move', readout);

/* the opening: the veil lifts on the valley in plan, then the camera sweeps down to frame the sites */
map.on('load', () => {
  clearTimeout(failTimer); addSiteLayers(); readout();
  document.querySelectorAll('.maplibregl-ctrl-attrib').forEach(a => a.classList.remove('maplibregl-compact-show'));
  document.body.classList.add('ready');
  if (!reduced) requestAnimationFrame(pulse);
  setTimeout(() => {
    map.flyTo({ ...overview(), duration: reduced ? 0 : 5600, curve: 1.42, essential: true });
    map.once('moveend', () => { document.body.classList.add('landed'); setTimeout(startOrbit, 900); });
  }, reduced ? 0 : 1100);
});
})();
</script>
</body>
</html>
