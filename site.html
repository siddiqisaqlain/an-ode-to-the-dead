<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Saqlain Siddiqi">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="copyright" content="© 2026 Saqlain Siddiqi. All rights reserved.">
<title>Graveyard Zones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
/* Layout: the zone map fills the screen; title top-left, zone switcher bottom-centre, grave list on a glass panel at the right
   (below the map on phones) */
body{overflow:hidden}
.app{position:relative;height:100%}
.stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 90% 75% at 40% 55%, var(--bg) 0%, var(--bg2) 100%)}
#view{display:block;width:100%;height:100%;touch-action:none}
.titlebar{position:absolute;z-index:5;top:calc(20px + env(safe-area-inset-top,0px));left:max(24px,env(safe-area-inset-left,0px));right:376px;pointer-events:none}
.titlebar .crumbs{margin-bottom:4px}
.titlebar p{margin:4px 0 0;font-size:15px;color:var(--label2)}
.tools{position:absolute;z-index:5;top:calc(20px + env(safe-area-inset-top,0px));right:364px;display:flex;flex-direction:column;gap:8px}
.tools .cbtn{background:var(--glass)}
.north{display:block;width:44px;height:44px;border-radius:50%}
.north g{transform-origin:22px 22px}
.tabs{position:absolute;z-index:6;left:calc((100% - 352px) / 2);bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:flex;gap:2px;padding:5px;border-radius:999px;max-width:calc(100% - 384px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;text-decoration:none;font-size:15px;font-weight:500;transition:background .2s}
.tabs a small{font-size:12px;font-weight:600;color:var(--label2)}
.tabs a:hover{background:var(--fill)}
.tabs a[aria-current="page"]{background:var(--tint);color:var(--tint-ink)}
.tabs a[aria-current="page"] small{color:inherit;opacity:.8}
.lbl3d{position:absolute;z-index:3;left:0;top:0;display:grid;place-items:center;min-width:28px;height:28px;padding:0 7px;margin:-14px 0 0 -14px;border-radius:14px;
  border:2.5px solid #fff;cursor:pointer;font-size:13px;font-weight:700;background:var(--label);color:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.lbl3d.rec{background:var(--mark);color:#fff}
.lbl3d.hot{transform:scale(1.2)}
.empty{position:absolute;z-index:4;left:calc((100% - 352px) / 2);bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  width:min(340px,calc(100% - 400px));text-align:center;pointer-events:none;border-radius:18px;padding:12px 16px}
.empty h3{font-size:15px;font-weight:600;margin:0 0 2px}
.empty p{margin:0;color:var(--label2);font-size:13px}
.panel{position:absolute;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:340px;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;background:var(--glass-strong)}
.panel header{padding:20px 20px 12px}
.panel header small{font-size:13px;font-weight:600;color:var(--label2)}
.panel header h2{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.025em;margin:2px 0 4px}
.panel header p{margin:0;font-size:13px;color:var(--label2)}
.graves{list-style:none;margin:0 16px 16px;padding:0;border-radius:14px;background:var(--fill);overflow-y:auto}
.graves li+li{border-top:.5px solid var(--hair)}
.graves a{display:flex;align-items:center;gap:12px;padding:10px 14px;text-decoration:none;min-height:56px}
.graves a:hover,.graves a.hot{background:var(--fill)}
.graves .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--label);color:var(--bg);font-size:13px;font-weight:700;flex:none}
.graves .rec .n{background:var(--mark);color:#fff}
.graves .t{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.graves .t b{font-weight:500;font-size:16px}
.graves .t span{font-size:13px;color:var(--label2)}
.graves .chev{width:8px;height:14px;color:var(--label3);flex:none}
.noneyet{padding:14px;color:var(--label2);font-size:14px}
@media (max-width:760px){
  body{overflow:auto}
  .app{height:auto}
  .stage{position:relative;height:64vh}
  .titlebar{right:72px}
  .tools{right:max(16px,env(safe-area-inset-right,0px))}
  .tabs{left:50%;max-width:calc(100% - 32px)}
  .empty{left:50%;width:calc(100% - 32px)}
  .panel{position:static;width:auto;margin:12px;border-radius:22px;background:var(--card);box-shadow:none;border:0}
}
@media (prefers-reduced-motion:reduce){.lbl3d,.tabs a{transition:none}}
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="view" aria-label="3D map of the zone. Drag to look around, pinch or scroll to zoom, tap a grave to open its record."></canvas>
    <div id="labels"></div>
    <header class="titlebar">
      <ol class="crumbs"><li><a href="index.html">Sites</a></li></ol>
      <h1 class="largetitle" id="siteName"></h1>
      <p id="zoneSrc"></p>
    </header>
    <div class="tools">
      <svg class="north glass" viewBox="0 0 44 44" aria-hidden="true">
        <g id="needle"><path d="M22 8 27 24H17Z" fill="var(--danger)"/><path d="M22 36 27 24H17Z" fill="var(--label3)"/></g></svg>
      <button class="cbtn icon glass" id="resetBtn" type="button" title="Reset view" aria-label="Reset view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5v4.5h4.5"/></svg>
      </button>
    </div>
    <nav class="tabs glass" id="tabs" aria-label="Zones"></nav>
    <div class="empty glass" id="empty" hidden><h3 id="emptyTitle"></h3><p id="emptyText"></p></div>
  </main>
  <aside class="panel glass">
    <header><small id="listTitle">Graves</small><h2 id="zoneTitle"></h2><p id="listNote"></p></header>
    <ol class="graves" id="graves"></ol>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="assets/archive.js"></script>
<script src="assets/models.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const site = Archive.site(Archive.params().site);
if (!site) { location.replace('index.html'); return; }
let zone = null;

document.title = site.name + ' · Zones';
$('siteName').textContent = site.name;
$('tabs').innerHTML = site.zones.map(z =>
  `<a href="${Archive.siteURL(site, z)}" data-zone="${z.id}">${z.id}${z.graves.length ? `<small>${z.graves.length}</small>` : ''}</a>`).join('');

/* ---------- scene ---------- */
const stage = $('stage'), canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(38, 1, .05, 500);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * .47;
scene.add(new THREE.HemisphereLight(0xf3f1e8, 0x4f5a47, .85));
const sun = new THREE.DirectionalLight(0xfff6e6, .9); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); scene.add(sun, sun.target);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.ShadowMaterial({ opacity: .18 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -.01; ground.receiveShadow = true; scene.add(ground);
let zoneGroup = null, picks = [], marks = [], extent = 10;

// on wide screens the grave panel covers the right of the map, so the view is centred on the part left of it
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight, side = innerWidth > 760 ? 352 : 0;
  renderer.setSize(w, h, false); camera.aspect = (w + side) / h;
  if (side) camera.setViewOffset(w + side, h, side, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

/* ---------- build a zone from its plan ---------- */
function buildZone(z){
  if (zoneGroup) scene.remove(zoneGroup);
  zoneGroup = new THREE.Group(); picks = []; marks = [];
  const b = z.boundary;
  let cx = 0, cz = 0;
  if (b) {
    const xs = b.map(p => p[0]), zs = b.map(p => p[1]);
    cx = (Math.min(...xs) + Math.max(...xs)) / 2; cz = (Math.min(...zs) + Math.max(...zs)) / 2;
    extent = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...zs) - Math.min(...zs));
    // zone floor, then a low wall along the boundary
    const shape = new THREE.Shape(b.map(([x, zz]) => new THREE.Vector2(x - cx, -(zz - cz))));
    const floor = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshStandardMaterial({ color: new THREE.Color(css('--zone')), roughness: 1 }));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; zoneGroup.add(floor);
    const wallMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(css(z.template ? '--wall' : '--mark')), roughness: .9 });   // template walls are muted
    b.forEach((p, i) => {
      const q = b[(i + 1) % b.length], dx = q[0] - p[0], dz = q[1] - p[1], len = Math.hypot(dx, dz);
      const w = new THREE.Mesh(new THREE.BoxGeometry(len + .1, .3, .1), wallMat);
      w.position.set((p[0] + q[0]) / 2 - cx, .15, (p[1] + q[1]) / 2 - cz); w.rotation.y = -Math.atan2(dz, dx);
      w.castShadow = w.receiveShadow = true; zoneGroup.add(w);
    });
  } else extent = 10;
  z.graves.forEach(g => {
    if (!g.plan) return;
    const m = GraveModels.build(g); m.position.set(g.plan.x - cx, 0, g.plan.z - cz);
    m.traverse(o => { if (o.isMesh) { o.userData.n = g.n; o.material.userData.e0 = o.material.emissive.clone(); picks.push(o); } });
    zoneGroup.add(m);
    const top = new THREE.Box3().setFromObject(m).max.y;
    const el = document.createElement('button'); el.type = 'button'; el.className = 'lbl3d' + (Archive.hasRecord(g) ? ' rec' : ''); el.textContent = g.n;
    el.setAttribute('aria-label', `Open grave ${g.n}`); el.addEventListener('click', () => open(g.n));
    el.addEventListener('mouseenter', () => hot(g.n)); el.addEventListener('mouseleave', () => hot(null));
    marks.push({ n: g.n, el, at: new THREE.Vector3(g.plan.x - cx, top + .25, g.plan.z - cz) });
  });
  $('labels').replaceChildren(...marks.map(m => m.el));
  scene.add(zoneGroup); fitView();
}
function fitView(){
  const r = Math.max(extent, 2), dist = r / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.25;
  camera.position.set(0, 0, 0).add(new THREE.Vector3(.35, 1.05, 1).normalize().multiplyScalar(dist));
  controls.target.set(0, 0, 0); controls.minDistance = 1; controls.maxDistance = r * 4; controls.update();
  sun.position.set(r * .8, r * 2, r * 1.1); const sc = sun.shadow.camera;
  sc.left = sc.bottom = -r; sc.right = sc.top = r; sc.near = .1; sc.far = r * 6; sc.updateProjectionMatrix();
}

/* ---------- side list ---------- */
function renderList(z){
  const gs = [...z.graves].sort((a, b) => a.n - b.n);
  $('listTitle').textContent = site.name;
  $('listNote').textContent = gs.length ? `${gs.length} graves, in the order of the zone plan. ${gs.filter(Archive.hasRecord).length} with a full record.` : 'Number of graves to come.';
  $('graves').innerHTML = gs.length ? gs.map(g => {
    const rec = Archive.hasRecord(g);
    const sub = g.scan ? `3D scan${g.sheet ? ' · Sheet ' + g.sheet : ''}` : rec ? 'Record' : g.templated ? 'Placed on template · record to come' : 'Default model · record to come';
    return `<li class="${rec ? 'rec' : ''}"><a href="${Archive.graveURL(site, z, g)}" data-n="${g.n}"><span class="n">${g.n}</span>
      <span class="t"><b>Grave ${g.n}</b><span>${sub}</span></span><svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 6 6-6 6"/></svg></a></li>`;
  }).join('') : '<li class="noneyet">No graves listed for this zone yet.</li>';
  $('graves').querySelectorAll('a').forEach(a => {
    a.addEventListener('mouseenter', () => hot(+a.dataset.n)); a.addEventListener('mouseleave', () => hot(null));
  });
}

function selectZone(id, push){
  zone = Archive.zone(site, id) || site.zones.find(z => z.graves.length) || site.zones[0];
  document.querySelectorAll('#tabs a').forEach(a => { if (a.dataset.zone === zone.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (push) history.pushState(null, '', Archive.siteURL(site, zone));
  $('zoneTitle').textContent = 'Zone ' + zone.id;
  $('zoneSrc').textContent = zone.template ? 'Template plan · actual zone plan to come' : `Traced from ${zone.source} · approximate scale`;
  $('empty').hidden = !zone.template;
  if (zone.template) {
    $('emptyTitle').textContent = 'Template plan';
    $('emptyText').textContent = zone.graves.length ? 'Graves are set out in rows until the zone plan is traced.'
      : 'The boundary and graves will be updated once the site plan for this zone is added.';
  }
  buildZone(zone); renderList(zone);
}
$('tabs').addEventListener('click', e => { const a = e.target.closest('a'); if (!a || e.metaKey || e.ctrlKey) return; e.preventDefault(); selectZone(a.dataset.zone, true); });
addEventListener('popstate', () => selectZone(Archive.params().zone));
$('resetBtn').addEventListener('click', fitView);

/* ---------- hover and click ---------- */
let hotN = null;
function hot(n){
  if (n === hotN) return; hotN = n;
  const tint = new THREE.Color(css('--mark'));
  picks.forEach(o => o.userData.n === n ? o.material.emissive.copy(tint).multiplyScalar(.35) : o.material.emissive.copy(o.material.userData.e0));
  marks.forEach(m => m.el.classList.toggle('hot', m.n === n));
  document.querySelectorAll('#graves a').forEach(a => a.classList.toggle('hot', +a.dataset.n === n));
  canvas.style.cursor = n !== null ? 'pointer' : 'grab';
}
function open(n){ const g = Archive.grave(zone, n); if (g) location.href = Archive.graveURL(site, zone, g); }
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e){
  const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(picks, false)[0]; return h ? h.object.userData.n : null;
}
let downAt = null;
canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && !e.buttons) hot(pick(e)); });
canvas.addEventListener('pointerleave', () => hot(null));
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!downAt) return; const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]); downAt = null;
  if (moved < 6 && e.button === 0) { const n = pick(e); if (n !== null) open(n); }
});

/* ---------- loop ---------- */
const v = new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera);
  const W = stage.clientWidth, H = stage.clientHeight;
  marks.forEach(m => { v.copy(m.at).project(camera); m.el.hidden = v.z > 1; m.el.style.transform = `translate(${(v.x * .5 + .5) * W}px,${(-v.y * .5 + .5) * H}px)`; });
  $('needle').style.transform = `rotate(${(zone.north || 0) + THREE.MathUtils.radToDeg(controls.getAzimuthalAngle())}deg)`;
}

resize(); selectZone(Archive.params().zone); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
