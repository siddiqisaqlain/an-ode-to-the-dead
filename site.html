<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Saqlain Siddiqi">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">

<title>Graveyard Zones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
/* Layout: bar → zone tabs → 3D zone map with the grave list beside it (below it on phones) */
body{overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.tabs a{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;text-decoration:none;font-size:14px;font-weight:500}
.tabs a small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.tabs a:hover{border-color:var(--accent)}
.tabs a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs a[aria-current="page"] small{color:inherit;opacity:.8}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 300px}
.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 50% 60%, var(--bg) 0%, var(--bg2) 100%)}
#view{display:block;width:100%;height:100%;touch-action:none}
.lbl3d{position:absolute;left:0;top:0;display:grid;place-items:center;min-width:24px;height:24px;padding:0 6px;margin:-12px 0 0 -12px;border-radius:12px;border:0;cursor:pointer;
  font-family:var(--f-mono);font-size:12px;font-weight:500;background:var(--ink);color:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .12s}
.lbl3d.rec{background:var(--mark);color:#1b1608}
.lbl3d.hot{transform:scale(1.25)}
.zonename{position:absolute;top:14px;left:max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.zonename h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;line-height:1.1}
.zonename p{margin:2px 0 0;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.north{position:absolute;top:14px;right:16px;width:44px;height:44px;pointer-events:none}
.north g{transform-origin:22px 22px}
.hud{position:absolute;bottom:12px;left:max(16px,env(safe-area-inset-left,0px));font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;pointer-events:none}
.empty{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:min(360px,calc(100% - 32px));text-align:center;pointer-events:none}
.empty div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.empty h3{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0 0 2px}
.empty p{margin:0;color:var(--muted);font-size:14px}
aside{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;display:flex;flex-direction:column}
aside header{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
aside header h3{margin:0;font-size:13px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
aside header p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.graves{list-style:none;margin:0;padding:6px}
.graves a{display:flex;align-items:center;gap:12px;padding:10px;border-radius:6px;text-decoration:none}
.graves a:hover,.graves a.hot{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.graves .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:13px;flex:none}
.graves .rec .n{background:var(--mark);color:#1b1608}
.graves .t{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.graves .t b{font-weight:500}
.graves .t span{font-size:12.5px;color:var(--muted)}
.noneyet{padding:16px;color:var(--muted);font-size:14px}
@media (max-width:760px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .body{grid-template-columns:1fr}
  .stage{height:58vh}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
}
@media (prefers-reduced-motion:reduce){.lbl3d{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <ol class="crumbs"><li><a href="index.html">Sites</a></li><li id="crSite"></li></ol>
      <h1 id="siteName"></h1>
    </div>
    <div class="actions">
      <button class="btn" id="resetBtn" type="button" title="Reset view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        <span class="lbl">Reset view</span>
      </button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Zones"></nav>
  <div class="body">
    <main class="stage" id="stage">
      <canvas id="view" aria-label="3D map of the zone. Drag to orbit, scroll to zoom, click a grave to open its record."></canvas>
      <div id="labels"></div>
      <div class="zonename"><h2 id="zoneTitle"></h2><p id="zoneSrc"></p></div>
      <svg class="north" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="var(--surface)" stroke="var(--line)"/>
        <g id="needle"><path d="M22 7 28 30 22 26 16 30Z" fill="var(--ink)"/></g><text x="22" y="40" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8" fill="var(--muted)">N</text></svg>
      <div class="empty" id="empty" hidden><div><h3 id="emptyTitle"></h3><p id="emptyText"></p></div></div>
      <div class="hud"><span>Drag · orbit</span><span>Scroll / pinch · zoom</span><span>Click a grave · open it</span></div>
    </main>
    <aside>
      <header><h3 id="listTitle">Graves</h3><p id="listNote"></p></header>
      <ol class="graves" id="graves"></ol>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="assets/archive.js"></script>
<script src="assets/models.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const site = Archive.site(Archive.params().site);
if (!site) { location.replace('index.html'); return; }
let zone = null;

document.title = site.name + ' · Zones';
$('crSite').textContent = site.name; $('siteName').textContent = site.name;
$('tabs').innerHTML = site.zones.map(z =>
  `<a href="${Archive.siteURL(site, z)}" data-zone="${z.id}">Zone ${z.id}<small>${z.graves.length || '–'}</small></a>`).join('');

/* ---------- scene ---------- */
const stage = $('stage'), canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(38, 1, .05, 500);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * .47;
scene.add(new THREE.HemisphereLight(0xf3f1e8, 0x4f5a47, .85));
const sun = new THREE.DirectionalLight(0xfff6e6, .9); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); scene.add(sun, sun.target);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: new THREE.Color(css('--ground')), roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -.01; ground.receiveShadow = true; scene.add(ground);
let zoneGroup = null, picks = [], marks = [], extent = 10;

function resize(){ const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);

/* ---------- build a zone from its plan ---------- */
function buildZone(z){
  if (zoneGroup) scene.remove(zoneGroup);
  zoneGroup = new THREE.Group(); picks = []; marks = [];
  const b = z.boundary;
  let cx = 0, cz = 0;
  if (b) {
    const xs = b.map(p => p[0]), zs = b.map(p => p[1]);
    cx = (Math.min(...xs) + Math.max(...xs)) / 2; cz = (Math.min(...zs) + Math.max(...zs)) / 2;
    extent = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...zs) - Math.min(...zs));
    // zone floor, then a low wall along the boundary
    const shape = new THREE.Shape(b.map(([x, zz]) => new THREE.Vector2(x - cx, -(zz - cz))));
    const floor = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshStandardMaterial({ color: new THREE.Color(css('--zone')), roughness: 1 }));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; zoneGroup.add(floor);
    const wallMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(css(z.template ? '--muted' : '--mark')), roughness: .9 });   // template walls are muted
    b.forEach((p, i) => {
      const q = b[(i + 1) % b.length], dx = q[0] - p[0], dz = q[1] - p[1], len = Math.hypot(dx, dz);
      const w = new THREE.Mesh(new THREE.BoxGeometry(len + .1, .3, .1), wallMat);
      w.position.set((p[0] + q[0]) / 2 - cx, .15, (p[1] + q[1]) / 2 - cz); w.rotation.y = -Math.atan2(dz, dx);
      w.castShadow = w.receiveShadow = true; zoneGroup.add(w);
    });
  } else extent = 10;
  z.graves.forEach(g => {
    if (!g.plan) return;
    const m = GraveModels.build(g); m.position.set(g.plan.x - cx, 0, g.plan.z - cz);
    m.traverse(o => { if (o.isMesh) { o.userData.n = g.n; o.material.userData.e0 = o.material.emissive.clone(); picks.push(o); } });
    zoneGroup.add(m);
    const top = new THREE.Box3().setFromObject(m).max.y;
    const el = document.createElement('button'); el.type = 'button'; el.className = 'lbl3d' + (Archive.hasRecord(g) ? ' rec' : ''); el.textContent = g.n;
    el.setAttribute('aria-label', `Open grave ${g.n}`); el.addEventListener('click', () => open(g.n));
    el.addEventListener('mouseenter', () => hot(g.n)); el.addEventListener('mouseleave', () => hot(null));
    marks.push({ n: g.n, el, at: new THREE.Vector3(g.plan.x - cx, top + .25, g.plan.z - cz) });
  });
  $('labels').replaceChildren(...marks.map(m => m.el));
  scene.add(zoneGroup); fitView();
}
function fitView(){
  const r = Math.max(extent, 2), dist = r / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.25;
  camera.position.set(0, 0, 0).add(new THREE.Vector3(.35, 1.05, 1).normalize().multiplyScalar(dist));
  controls.target.set(0, 0, 0); controls.minDistance = 1; controls.maxDistance = r * 4; controls.update();
  sun.position.set(r * .8, r * 2, r * 1.1); const sc = sun.shadow.camera;
  sc.left = sc.bottom = -r; sc.right = sc.top = r; sc.near = .1; sc.far = r * 6; sc.updateProjectionMatrix();
}

/* ---------- side list ---------- */
function renderList(z){
  const gs = [...z.graves].sort((a, b) => a.n - b.n);
  $('listTitle').textContent = `Graves in Zone ${z.id}`;
  $('listNote').textContent = gs.length ? `${gs.length} graves, in the order of the zone plan. ${gs.filter(Archive.hasRecord).length} with a full record.` : 'Number of graves to come.';
  $('graves').innerHTML = gs.length ? gs.map(g => {
    const rec = Archive.hasRecord(g);
    const sub = g.scan ? `3D scan${g.sheet ? ' · Sheet ' + g.sheet : ''}` : rec ? 'Record' : g.templated ? 'Placed on template · record to come' : 'Default model · record to come';
    return `<li class="${rec ? 'rec' : ''}"><a href="${Archive.graveURL(site, z, g)}" data-n="${g.n}"><span class="n">${g.n}</span>
      <span class="t"><b>Grave ${g.n}</b><span>${sub}</span></span>${rec ? '<span class="tag on">Open</span>' : ''}</a></li>`;
  }).join('') : '<li class="noneyet">No graves listed for this zone yet.</li>';
  $('graves').querySelectorAll('a').forEach(a => {
    a.addEventListener('mouseenter', () => hot(+a.dataset.n)); a.addEventListener('mouseleave', () => hot(null));
  });
}

function selectZone(id, push){
  zone = Archive.zone(site, id) || site.zones.find(z => z.graves.length) || site.zones[0];
  document.querySelectorAll('#tabs a').forEach(a => { if (a.dataset.zone === zone.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (push) history.pushState(null, '', Archive.siteURL(site, zone));
  $('zoneTitle').textContent = 'Zone ' + zone.id;
  $('zoneSrc').textContent = zone.template ? 'Template plan · actual zone plan to come' : `Traced from ${zone.source} · approximate scale`;
  $('empty').hidden = !zone.template;
  if (zone.template) {
    $('emptyTitle').textContent = 'Template plan';
    $('emptyText').textContent = zone.graves.length ? 'Graves are set out in rows until the zone plan is traced.'
      : 'The boundary and graves will be updated once the site plan for this zone is added.';
  }
  buildZone(zone); renderList(zone);
}
$('tabs').addEventListener('click', e => { const a = e.target.closest('a'); if (!a || e.metaKey || e.ctrlKey) return; e.preventDefault(); selectZone(a.dataset.zone, true); });
addEventListener('popstate', () => selectZone(Archive.params().zone));
$('resetBtn').addEventListener('click', fitView);

/* ---------- hover and click ---------- */
let hotN = null;
function hot(n){
  if (n === hotN) return; hotN = n;
  const tint = new THREE.Color(css('--mark'));
  picks.forEach(o => o.userData.n === n ? o.material.emissive.copy(tint).multiplyScalar(.35) : o.material.emissive.copy(o.material.userData.e0));
  marks.forEach(m => m.el.classList.toggle('hot', m.n === n));
  document.querySelectorAll('#graves a').forEach(a => a.classList.toggle('hot', +a.dataset.n === n));
  canvas.style.cursor = n !== null ? 'pointer' : 'grab';
}
function open(n){ const g = Archive.grave(zone, n); if (g) location.href = Archive.graveURL(site, zone, g); }
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e){
  const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(picks, false)[0]; return h ? h.object.userData.n : null;
}
let downAt = null;
canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && !e.buttons) hot(pick(e)); });
canvas.addEventListener('pointerleave', () => hot(null));
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!downAt) return; const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]); downAt = null;
  if (moved < 6 && e.button === 0) { const n = pick(e); if (n !== null) open(n); }
});

/* ---------- loop ---------- */
const v = new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera);
  const W = stage.clientWidth, H = stage.clientHeight;
  marks.forEach(m => { v.copy(m.at).project(camera); m.el.hidden = v.z > 1; m.el.style.transform = `translate(${(v.x * .5 + .5) * W}px,${(-v.y * .5 + .5) * H}px)`; });
  $('needle').style.transform = `rotate(${(zone.north || 0) + THREE.MathUtils.radToDeg(controls.getAzimuthalAngle())}deg)`;
}

resize(); selectZone(Archive.params().zone); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
