<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Saqlain Siddiqi">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="copyright" content="© 2026 Saqlain Siddiqi. All rights reserved.">
<title>Graveyard Zones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://s3.amazonaws.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="assets/site.css?v=5">
<style>
/* Site: the same 3D map as the front page, flown in close. Each zone plan sits on the map where its sheet's coordinate puts it,
   outlined and lit; its graves stand on it. Title top-left, zone switcher bottom-centre, zone and grave list on the right. */
:root{ --paper:#ecebe6; --ink:#1d1d1f; --ink2:#6e6e73; --rule:rgba(29,29,31,.16); --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --paper:#141518; --ink:#f5f5f7; --ink2:#98989d; --rule:rgba(245,245,247,.14) }}
:root[data-theme="dark"]{ --paper:#141518; --ink:#f5f5f7; --ink2:#98989d; --rule:rgba(245,245,247,.14) }

body{overflow:hidden;background:var(--paper)}
#map{position:fixed;inset:0;background:var(--paper)}
.veil{position:fixed;inset:0;z-index:2;background:var(--paper);pointer-events:none;transition:opacity .7s var(--ease)}
body.ready .veil{opacity:0}
.fade{position:fixed;z-index:1;top:0;left:0;right:0;height:220px;pointer-events:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--paper) 82%,transparent),transparent)}
.frame{position:fixed;z-index:3;inset:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  border:.5px solid var(--rule);pointer-events:none}
.frame::before,.frame::after{content:"";position:absolute;width:14px;height:14px;border:solid var(--ink);opacity:.5}
.frame::before{left:-1px;top:-1px;border-width:1.5px 0 0 1.5px}
.frame::after{right:-1px;bottom:-1px;border-width:0 1.5px 1.5px 0}

.titlebar{position:fixed;z-index:4;top:max(36px,calc(env(safe-area-inset-top,0px) + 24px));left:calc(max(12px,env(safe-area-inset-left,0px)) + 384px);right:96px;pointer-events:none}
.titlebar .segnav{margin-bottom:16px}
.titlebar h1{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,3.6vw,44px);line-height:1.02;letter-spacing:-.03em;margin:0;color:var(--ink)}
.titlebar p{margin:8px 0 0;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase}
.rise{opacity:0;transform:translateY(12px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
body.ready .rise{opacity:1;transform:none}

/* zone tags: a short leader with the zone letter and its grave count */
.zt{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.zt > *{opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
body.landed .zt > *{opacity:1;transform:none}
.zt-tag{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:999px;white-space:nowrap;font-size:12.5px;font-weight:600;color:var(--label)}
.zt-tag b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--mark);color:#fff;font-size:12px;font-weight:700}
.zt-tag small{font-weight:500;color:var(--label2)}
.zt.tpl .zt-tag b{background:var(--label3)}
.zt-stem{width:1px;height:var(--stem,28px);background:linear-gradient(var(--ink),color-mix(in srgb,var(--ink) 10%,transparent))}
.zt:hover .zt-tag,.zt.hot .zt-tag{background:var(--glass-strong)}
body.zoomed .zt{display:none}
/* grave numbers, shown for the zone in view */
.gn{display:grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;border:2px solid #fff;background:var(--ink);color:var(--paper);
  font-size:11px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.gn.rec{background:var(--mark);color:#fff}
.gn.hot{transform:scale(1.25)}
/* tree name, shown for the zone in view */
.tn{padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--label);pointer-events:none;white-space:nowrap}

/* left, as on the other pages: zones, then a zone's graves */
.panel{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));
  width:360px;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;background:var(--glass-strong);
  transform:translateX(calc(-100% - 24px));transition:transform .7s var(--ease)}
body.ready .panel{transform:none}
.panel header{flex:none;padding:20px 20px 10px}
.panel header small{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--label2)}
.panel header h2{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.025em;margin:4px 0 4px}
.panel header p{margin:0;font-size:13px;color:var(--label2);line-height:1.45}
.back{flex:none;display:flex;align-items:center;gap:4px;margin:0 16px 6px;padding:0;border:0;background:none;color:var(--tint);font-size:15px;cursor:pointer}
.back svg{width:16px;height:16px}
.list{list-style:none;margin:6px 16px 12px;padding:0;border-radius:14px;background:var(--fill);overflow-y:auto;flex:0 1 auto}
.list li+li{border-top:.5px solid var(--hair)}
.list a,.list button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;min-height:56px;border:0;background:none;text-align:left;text-decoration:none;cursor:pointer;color:var(--label)}
.list a:hover,.list button:hover,.list .hot{background:var(--fill)}
.badge{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;flex:none;background:var(--label);color:var(--bg);font-size:13px;font-weight:700}
.badge.z{background:var(--mark);color:#fff;font-size:15px}
.badge.tpl{background:var(--label3)}
.badge.rec{background:var(--mark);color:#fff}
.list .t{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.list .t b{font-weight:500;font-size:16px}
.list .t span{font-size:13px;color:var(--label2)}
.chev{width:8px;height:14px;color:var(--label3);flex:none}
.refmap{flex:none;margin:0 16px 12px;border-radius:14px;background:var(--fill);overflow:hidden}
.refmap summary{cursor:pointer;padding:10px 14px;font-size:15px;font-weight:500;color:var(--tint);list-style:none}
.refmap summary::-webkit-details-marker{display:none}
.refmap summary::after{content:"Show";float:right;font-size:13px;color:var(--label2);font-weight:400}
.refmap[open] summary::after{content:"Hide"}
.refmap img{display:block;width:100%;background:#fff}
/* survey details: the zone (or site) as found on the ground */
.facts{flex:none;margin:0 16px 12px;padding:4px 14px;border-radius:14px;background:var(--fill);font-size:13px;line-height:1.4}
.facts div{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:8px 0}
.facts div+div{border-top:.5px solid var(--hair)}
.facts dt{color:var(--label2);font-size:12px}
.facts dd{margin:0;color:var(--label)}
.facts dd small{display:block;color:var(--label2);font-size:12px}
.facts .conf{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--fill);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.facts .conf.low{color:var(--mark)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{flex:none;margin:auto 16px 16px;font-size:12px;line-height:1.45;color:var(--label2)}
.note b{color:var(--label);font-weight:600}

/* bottom: zone switcher */
.tabs{position:fixed;z-index:5;left:calc(384px + (100% - 384px) / 2);bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  display:flex;gap:2px;padding:5px;border-radius:999px;max-width:calc(100% - 420px);overflow-x:auto;scrollbar-width:none;transition:opacity .6s var(--ease) .2s,transform .6s var(--ease) .2s}
body.ready .tabs{opacity:1;transform:translateX(-50%)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:0;border-radius:999px;background:none;font-size:15px;font-weight:500;cursor:pointer;color:var(--label)}
.tabs button small{font-size:12px;font-weight:600;color:var(--label2)}
.tabs button:hover{background:var(--fill)}
.tabs button[aria-pressed="true"]{background:var(--tint);color:var(--tint-ink)}
.tabs button[aria-pressed="true"] small{color:inherit;opacity:.8}

.north{position:fixed;z-index:4;top:max(36px,calc(env(safe-area-inset-top,0px) + 24px));right:max(36px,calc(env(safe-area-inset-right,0px) + 24px));width:48px;height:48px;border-radius:50%;display:grid;place-items:center;pointer-events:none}
.north svg{width:30px;height:30px}
.maplibregl-ctrl-scale{background:transparent;border-color:var(--ink2);color:var(--ink2);font-family:var(--f-mono);font-size:10px}
.maplibregl-ctrl-attrib{background:var(--glass)!important;color:var(--ink2)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--ink2)!important}
.maplibregl-ctrl-bottom-left{left:calc(max(12px,env(safe-area-inset-left,0px)) + 384px);bottom:28px}

body.nomap .tabs,body.nomap .north,body.nomap .frame{display:none}
body.nomap .rise{opacity:1;transform:none}

@media (max-width:760px){
  body{overflow:auto}
  #map{position:fixed;height:62vh}
  .fade{height:160px}
  .titlebar{right:76px;left:20px;top:max(26px,calc(env(safe-area-inset-top,0px) + 18px))}
  .titlebar p{display:none}
  .north{right:20px;top:max(26px,calc(env(safe-area-inset-top,0px) + 18px))}
  .panel{position:absolute;top:62vh;left:0;right:0;bottom:auto;width:auto;margin:-24px 0 0;border-radius:24px 24px 0 0;min-height:calc(38vh + 24px);
    background:var(--bg);box-shadow:0 -10px 30px -12px rgba(0,0,0,.25);border:0;transform:none}
  .list{overflow:visible}
  .tabs{left:50%;bottom:auto;top:calc(62vh - 76px);max-width:calc(100% - 32px)}
  .frame{display:none}
  .maplibregl-ctrl-bottom-left{left:20px;bottom:96px}
}
.gn.picked{transform:scale(1.5);box-shadow:0 0 0 8px color-mix(in srgb,var(--mark) 30%,transparent),0 2px 6px rgba(0,0,0,.3)}

/* opening a grave: the chrome steps aside, the camera dives onto the grave, and the grave page's stage blooms out of it */
body.leaving .panel{transform:translateX(calc(-100% - 24px))}
body.leaving .tabs{opacity:0;transform:translate(-50%,20px)}
body.leaving .rise,body.leaving .north,body.leaving .maplibregl-ctrl-bottom-left{opacity:0;transition:opacity .4s var(--ease)}
body.leaving .gn:not(.picked){opacity:0;transition:opacity .3s}
.bloom{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;transform:scale(.15);
  background:radial-gradient(circle at 50% 50%,var(--bg) 0 32%,color-mix(in srgb,var(--bg) 0%,transparent) 64%)}
body.bloom-on .bloom{opacity:1;transform:scale(3.2);transition:opacity .3s ease-in,transform .5s cubic-bezier(.5,0,.75,0)}
@media (max-width:760px){ body.leaving .panel{transform:translateY(40px);opacity:0;transition:opacity .4s,transform .4s} }
@media (prefers-reduced-motion:reduce){ .veil,.rise,.zt > *,.panel,.tabs,.gn{transition:none!important} }
</style>
</head>
<body>
<div id="map" aria-label="3D map of the graveyard and its zones"></div>
<div class="fade"></div>
<div class="veil"></div>
<div class="frame" aria-hidden="true"></div>
<div class="bloom" aria-hidden="true"></div>

<header class="titlebar">
  <nav class="rise" id="nav"></nav>
  <h1 class="rise" id="siteName"></h1>
  <p class="rise" id="siteMeta"></p>
</header>
<div class="north glass" aria-hidden="true"><svg id="needle" viewBox="0 0 34 34"><path d="M17 4 21.5 17h-9Z" fill="var(--ink)"/><path d="M17 30 21.5 17h-9Z" fill="none" stroke="var(--ink)" stroke-width="1"/></svg></div>

<nav class="tabs glass" id="tabs" aria-label="Zones"></nav>

<aside class="panel glass" aria-live="polite">
  <header><small id="pKicker"></small><h2 id="pTitle"></h2><p id="pNote"></p></header>
  <button class="back" id="back" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19 8 12l7-7"/></svg>All zones</button>
  <details class="refmap" id="refmap" hidden><summary>Zone map, as drawn</summary><img id="refimg" alt="" loading="lazy"></details>
  <dl class="facts" id="facts" hidden></dl>
  <ol class="list" id="list"></ol>
  <p class="note" id="note"></p>
</aside>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="assets/archive.js?v=15"></script>
<script src="assets/map.js?v=8"></script>
<script src="assets/nav.js?v=5"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="assets/site-model.js?v=1"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const P = Archive.params(), site = Archive.site(P.site);
if (!site) { location.replace('index.html'); return; }
if (P.theme === 'light' || P.theme === 'dark') document.documentElement.dataset.theme = P.theme;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches, mobile = () => innerWidth <= 760;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chev = '<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 6 6-6 6"/></svg>';
const G = MapKit.geo(site), L = G.labels, total = L.reduce((a, l) => a + l.graves.length, 0);

document.title = site.name + ' · Zones';
$('siteName').textContent = site.name;
$('siteMeta').textContent = `${site.place} · ${site.zones.length} zone${site.zones.length > 1 ? 's' : ''}${total ? ` · ${total} graves` : ''}`;
const nav = Nav.mount({ el: $('nav'), trail: [{ label: 'Sites', href: 'index.html' }, { label: site.name }] });
function setNav(z){
  nav.set([{ label: 'Sites', href: 'index.html' }, { label: site.name, href: Archive.siteURL(site), run: () => focusZone('') }].concat(z ? [{ label: 'Zone ' + z.id }] : []));
}
$('tabs').innerHTML = `<button type="button" data-z="" aria-pressed="true">All</button>` +
  site.zones.map(z => `<button type="button" data-z="${z.id}" aria-pressed="false">${z.id}${z.graves.length ? `<small>${z.graves.length}</small>` : ''}</button>`).join('');

/* ---------- the panel: zones, or one zone's graves ---------- */
const placed = { reference: 'Placed where the site key plan marks it', sheet: 'Placed by the coordinate on its sheet', site: 'Placed at the site\'s reference point', template: 'Template plan, placed at the site\'s reference point' };
function showZones(){
  $('pKicker').textContent = site.place; $('pTitle').textContent = `${site.zones.length} zone${site.zones.length > 1 ? 's' : ''}`;
  $('pNote').textContent = total ? `${total} graves across the site. Choose a zone to fly into it.` : 'Zone plans to come.';
  $('back').hidden = true; $('refmap').hidden = true;
  $('list').innerHTML = L.map(l => {
    const z = l.zone, n = l.graves.length;
    return `<li><button type="button" data-z="${z.id}"><span class="badge z${z.template ? ' tpl' : ''}">${z.id}</span>
      <span class="t"><b>Zone ${z.id}</b><span>${n ? `${n} grave${n > 1 ? 's' : ''}` : 'Graves to come'} · ${z.template ? 'template plan' : 'traced plan'}</span></span>${chev}</button></li>`;
  }).join('');
  siteFacts();
  $('note').innerHTML = site.zones.some(z => z.at)
    ? '<b>How zones are placed.</b> Each zone is set where the site key plan marks it; the key plan was aligned to satellite imagery. Zone outlines and graves are traced from each zone map at approximate scale.'
    : site.zones.some(z => !z.template)
    ? '<b>How zones are placed.</b> Each zone plan is traced from its zone map and pinned to the coordinate recorded on its sheet, at the grave the sheet names. Plans are at approximate scale and phone-GPS coordinates can be several metres out, so neighbouring zones may overlap.'
    : '<b>Template plans.</b> These zones are placeholders set at the site\'s reference point until their zone maps and coordinates arrive.';
  bindList();
}
function showZone(l){
  const z = l.zone, gs = [...l.graves].sort((a, b) => a.n - b.n);
  $('pKicker').textContent = site.name; $('pTitle').textContent = `Zone ${z.id}`;
  $('pNote').textContent = (gs.length ? `${gs.length} grave${gs.length > 1 ? 's' : ''}, in the order of the zone plan. ` : '') + placed[l.how] + (z.coordsFrom && l.how === 'sheet' ? `, taken at ${z.coordsFrom}` : '') + '.';
  $('back').hidden = false;
  $('refmap').hidden = !z.map; if (z.map) { $('refimg').src = z.map; $('refimg').alt = `Zone ${z.id} map, as drawn on the sheet`; }
  $('list').innerHTML = gs.length ? gs.map(g => {
    const grave = Archive.grave(z, g.n), sub = grave.scan ? `3D scan${grave.sheet ? ' · Sheet ' + grave.sheet : ''}` : g.rec ? 'Record' : 'Default model · record to come';
    return `<li><a href="${Archive.graveURL(site, z, grave)}" data-n="${g.n}"><span class="badge${g.rec ? ' rec' : ''}">${g.n}</span>
      <span class="t"><b>Grave ${g.n}</b><span>${sub}</span></span>${chev}</a></li>`;
  }).join('') : '<li><span class="t" style="padding:14px"><span>No graves listed for this zone yet.</span></span></li>';
  zoneFacts(z);
  $('note').innerHTML = z.coordsCheck ? `<b>Sheet coordinate to check.</b> ${esc(z.coordsCheck)}.${l.how === 'reference' ? ' The zone is placed from the site key plan, so this does not affect the map.' : ''}` : '';
  bindList();
}
/* survey details: what the site survey found on the ground */
const row = (k, v, sub) => `<div><dt>${k}</dt><dd>${v}${sub ? `<small>${sub}</small>` : ''}</dd></div>`;
const m2 = a => `${Math.round(a).toLocaleString('en')} m²`;
function siteFacts(){
  const s = site.survey; $('facts').hidden = !s; if (!s) return;
  $('facts').innerHTML = row('Precinct', `about ${m2(s.precinct)}`, esc(s.setting)) +
    s.landmarks.map(b => row('Building', esc(b.name), `${m2(b.footprint)} footprint · ${esc(b.height)} · ${esc(b.note)}`)).join('') +
    row('Ground', `${s.ground} m above sea level`, 'Satellite elevation model; the precinct is nearly level') +
    (site.context ? row('On the map', legend()) : '') +
    row('Survey', esc(s.date), 'Traced from satellite imagery; heights are estimates');
}
function zoneFacts(z){
  const s = z.survey; $('facts').hidden = !s; if (!s) return;
  $('facts').innerHTML = row('Enclosure', `about ${m2(s.area)} <span class="conf ${s.confidence}">${s.confidence} confidence</span>`, esc(s.setting)) +
    row('Ground', esc(s.cover)) + row('Nearby', esc(s.near)) + row('Sheet point', esc(s.sheet)) +
    (z.trees || []).map(t => row('Tree', esc(t.name) + (t.between ? ` between graves ${t.between.join(' and ')}` : ''),
      `about ${t.height} m tall, crown about ${t.crown} m across (est.)`)).join('');
}
function legend(){
  const k = CTX_COLORS;
  return `<span class="legend">${[['Building', k.building], ['Landmark', k.landmark], ['Imambargah roof', k.roof.B03], ['Masjid roof', k.roof.B01],
    ['Trees', k.trees], ['Grass', k.grass], ['Bare earth', k.earth], ['Open ground', k.ground], ['Water', c.water],
    ['Paved path', k.path], ['Earth path', k.earthPath]]
    .map(([n, col]) => `<span><i style="background:${col}"></i>${n}</span>`).join('')}</span>`;
}
function bindList(){
  $('list').querySelectorAll('button[data-z]').forEach(b => {
    b.addEventListener('click', () => focusZone(b.dataset.z));
    b.addEventListener('mouseenter', () => hotZone(b.dataset.z)); b.addEventListener('mouseleave', () => hotZone(null));
  });
  $('list').querySelectorAll('a[data-n]').forEach(a => {
    a.addEventListener('mouseenter', () => hotGrave(+a.dataset.n)); a.addEventListener('mouseleave', () => hotGrave(null));
  });
}
$('back').addEventListener('click', () => focusZone(''));
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) focusZone(b.dataset.z); });

/* ---------- the map ---------- */
const c = MapKit.palette();
const CTX_COLORS = c.dark
  ? { trees: '#24352a', grass: '#2c3a29', earth: '#2d2a25', building: c.bld, landmark: '#9c978b', wall: '#bdb8ac', path: '#3a3b40', trunk: '#6b5f50', crown: '#4f6b52', platform: '#36353a',
      earthPath: '#3b352c', road: '#3e4046', casing: '#232427', ground: '#2a2924',
      roof: { B01: '#a9a397', B02: '#4d4c49', B03: '#66727e', B04: '#5f7a5c' } }
  : { trees: '#c9d3bb', grass: '#dbe3c8', earth: '#e3dccd', building: c.bld, landmark: c.stone, wall: '#a8a397', path: '#ffffff', trunk: '#8a7b68', crown: '#93ab86', platform: '#e6e2d8',
      earthPath: '#d6c9ae', road: '#fbfaf7', casing: '#cfcabd', ground: '#e8e3d0',
      roof: { B01: '#e6dfcf', B02: '#7a7975', B03: '#93a1ae', B04: '#93ad8f' } };
/* line width in metres on the ground: pixels per metre at this latitude double with each zoom level */
const metres = w => ['interpolate', ['exponential', 2], ['zoom'], 14, ['*', w, .126], 16, ['*', w, .506], 22, ['*', w, 32.36], 23, ['*', w, 64.7]];
const all = new maplibregl.LngLatBounds(); L.forEach(l => { all.extend(l.bounds[0]); all.extend(l.bounds[1]); });
let map;
try {
  map = new maplibregl.Map({ container: 'map', style: MapKit.style(c, { exaggeration: 1, villagesFrom: 14, buildingOpacity: .8 }),
    ...MapKit.entry(site), maxZoom: 22.5, maxPitch: 78, attributionControl: { compact: true },
    canvasContextAttributes: { antialias: true } });
} catch (e) { document.body.classList.add('nomap', 'ready', 'landed'); showZones(); return; }
map.addControl(new maplibregl.ScaleControl({ maxWidth: 100, unit: 'metric' }), 'bottom-left');
const failTimer = setTimeout(() => { if (!map.loaded()) document.body.classList.add('nomap', 'ready', 'landed'); }, 12000);

/* the site survey under the zones: ground cover, the canal, walls, paths, and buildings at their estimated eave heights */
function addContext(){
  if (!site.context) return;
  fetch(site.context).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(data => {
    fitToZones(data);
    map.addSource('ctx', { type: 'geojson', data });
    const k = CTX_COLORS, is = (...kinds) => ['in', ['get', 'kind'], ['literal', kinds]], before = 'zone-fill';
    const fill = (id, kind, color, op) => map.addLayer({ id, type: 'fill', source: 'ctx', filter: is(kind), paint: { 'fill-color': color, 'fill-opacity': op } }, before);
    fill('ctx-earth', 'earth', k.earth, .9);
    fill('ctx-grass', 'grass', k.grass, .9);
    fill('ctx-trees', 'trees', k.trees, .85);
    fill('ctx-ground', 'ground', k.ground, .8);
    fill('ctx-water', 'water', c.water, 1);
    fill('ctx-platform', 'platform', k.platform, 1);   // flat paving: an extrusion this thin shows the terrain's slope as a wedge
    map.addLayer({ id: 'ctx-ground-edge', type: 'line', source: 'ctx', filter: is('ground'),
      paint: { 'line-color': c.label, 'line-width': 1, 'line-dasharray': [2, 2], 'line-opacity': .6 } }, before);
    map.addLayer({ id: 'ctx-water-edge', type: 'line', source: 'ctx', filter: is('water'), layout: { 'line-join': 'round' },
      paint: { 'line-color': c.waterLine, 'line-width': ['interpolate', ['linear'], ['zoom'], 16, .8, 20, 2] } }, before);
    /* streets and paths at their surveyed width; a darker casing keeps the edges readable on bare ground */
    const lines = (id, kinds, color, extra) => map.addLayer({ id, type: 'line', source: 'ctx', filter: kinds,
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': color, 'line-width': metres(extra ? ['+', ['get', 'w'], extra] : ['get', 'w']) } }, before);
    lines('ctx-road-case', is('road'), k.casing, .8);
    lines('ctx-road', is('road'), k.road);
    lines('ctx-path-case', is('path'), k.casing, .5);
    lines('ctx-path', is('path'), ['match', ['get', 'surface'], 'earth', k.earthPath, k.path]);
    map.addLayer({ id: 'ctx-precinct', type: 'line', source: 'ctx', filter: is('precinct'),
      paint: { 'line-color': c.label, 'line-width': 1.2, 'line-dasharray': [4, 3], 'line-opacity': .8 } }, before);
    /* buildings to their eaves; the main buildings carry their roofs as stacked, stepped-in slabs in the roof's colour */
    const roofColor = ['match', ['get', 'mat'], ...Object.entries(k.roof).flat(), k.landmark];
    map.addLayer({ id: 'ctx-3d', type: 'fill-extrusion', source: 'ctx', minzoom: 14, filter: is('building', 'landmark', 'wall', 'roof'),
      paint: { 'fill-extrusion-color': ['match', ['get', 'kind'], 'roof', roofColor,
                 ['match', ['get', 'id'], 'B07', k.building, ['match', ['get', 'kind'], 'landmark', k.landmark, 'wall', k.wall, k.building]]],
               'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 14, 0, 15.5, ['get', 'h']],
               'fill-extrusion-base': ['interpolate', ['linear'], ['zoom'], 14, 0, 15.5, ['coalesce', ['get', 'base'], 0]],
               'fill-extrusion-opacity': .92, 'fill-extrusion-vertical-gradient': true } }, 'graves-3d');
    if (window.SiteModel && SiteModel.has(site.id)) map.setLayoutProperty('ctx-3d', 'visibility', 'none');   // the textured model stands in for these blocks
    const text = (size, extra) => Object.assign({ 'text-field': ['get', 'label'], 'text-font': ['Noto Sans Regular'], 'text-size': size,
      'text-letter-spacing': .08, 'text-max-width': 9 }, extra);
    const ink = { 'text-color': c.label, 'text-halo-color': c.halo, 'text-halo-width': 1.4 };
    map.addLayer({ id: 'ctx-names', type: 'symbol', source: 'ctx', minzoom: 16.5, filter: ['all', is('landmark', 'ground'), ['has', 'label']],
      layout: text(['match', ['get', 'id'], ['B01', 'B03'], 12, 10.5]), paint: ink });
    map.addLayer({ id: 'ctx-water-name', type: 'symbol', source: 'ctx', minzoom: 16, filter: ['all', is('water'), ['has', 'label']],
      layout: text(11, { 'text-font': ['Noto Sans Italic'], 'text-letter-spacing': .2 }),
      paint: Object.assign({}, ink, { 'text-color': c.waterLine }) });
    map.addLayer({ id: 'ctx-street-names', type: 'symbol', source: 'ctx', minzoom: 16, filter: ['all', is('road', 'path'), ['has', 'label']],
      layout: text(['match', ['get', 'kind'], 'road', 10.5, 9.5], { 'symbol-placement': 'line', 'text-max-angle': 30, 'symbol-spacing': 480 }),
      paint: ink });
  }).catch(() => {});
}
/* a zone's fits: redraw a survey building as a rectangle squared to the zone plan, its corner on the zone's boundary,
   so it meets the outline at a right angle instead of overlapping it */
function fitToZones(data){
  L.forEach(l => (l.zone.fits || []).forEach(fit => {
    const f = data.features.find(x => x.properties.id === fit.id); if (!f) return;
    const [x, z] = fit.corner, w = fit.w / l.k, d = fit.d / l.k;
    const ring = [[x, z], [x + w, z], [x + w, z - d], [x, z - d], [x, z]].map(p => l.at(p[0], p[1]));
    f.geometry = { type: 'Polygon', coordinates: [ring] };
  }));
}

function addLayers(){
  map.addSource('zones', { type: 'geojson', data: G.zones });
  map.addSource('graves', { type: 'geojson', data: G.graves });
  const st = (k, on, off) => ['case', ['boolean', ['feature-state', k], false], on, off];
  map.addLayer({ id: 'zone-fill', type: 'fill', source: 'zones',
    paint: { 'fill-color': c.mark, 'fill-opacity': ['case', ['boolean', ['feature-state', 'dim'], false], .04, st('hot', .3, st('on', .2, .14))], 'fill-opacity-transition': { duration: 300 } } });
  map.addLayer({ id: 'zone-line', type: 'line', source: 'zones', filter: ['!', ['get', 'template']], layout: { 'line-join': 'round' },
    paint: { 'line-color': c.mark, 'line-width': ['interpolate', ['exponential', 2], ['zoom'], 16, 1.2, 20, 3, 22, 6],
             'line-opacity': ['case', ['boolean', ['feature-state', 'dim'], false], .25, 1] } });
  map.addLayer({ id: 'zone-line-tpl', type: 'line', source: 'zones', filter: ['get', 'template'],
    paint: { 'line-color': c.label, 'line-width': 1.4, 'line-dasharray': [3, 2] } });
  map.addLayer({ id: 'graves-3d', type: 'fill-extrusion', source: 'graves', minzoom: 15,
    paint: { 'fill-extrusion-color': st('hot', c.mark, ['case', ['get', 'rec'], c.mark, c.stone]),
             'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 15, 0, 17, ['get', 'h']],
             'fill-extrusion-opacity': .95, 'fill-extrusion-vertical-gradient': true } });
  /* trees recorded in a zone: an opaque trunk and a see-through crown, so the graves beneath stay readable */
  map.addSource('trees', { type: 'geojson', data: G.trees });
  const grow = v => ['interpolate', ['linear'], ['zoom'], 15, 0, 17, ['get', v]];
  map.addLayer({ id: 'tree-trunk', type: 'fill-extrusion', source: 'trees', minzoom: 15, filter: ['==', ['get', 'part'], 'trunk'],
    paint: { 'fill-extrusion-color': CTX_COLORS.trunk, 'fill-extrusion-base': grow('base'), 'fill-extrusion-height': grow('top'), 'fill-extrusion-opacity': 1 } });
  map.addLayer({ id: 'tree-crown', type: 'fill-extrusion', source: 'trees', minzoom: 15, filter: ['==', ['get', 'part'], 'crown'],
    paint: { 'fill-extrusion-color': CTX_COLORS.crown, 'fill-extrusion-base': grow('base'), 'fill-extrusion-height': grow('top'),
             'fill-extrusion-opacity': .5, 'fill-extrusion-vertical-gradient': true } });
}

/* zone tags (overview) and grave numbers (inside a zone) */
const tags = L.map((l, k) => {
  const el = document.createElement('div'); el.className = 'zt' + (l.zone.template ? ' tpl' : '');
  el.style.setProperty('--stem', (26 + (k % 3) * 30) + 'px');
el.innerHTML = `<div class="zt-tag glass"><b>${l.zone.id}</b>Zone ${l.zone.id}<small>${l.graves.length || ''}</small></div><i class="zt-stem"></i>`;
  [...el.children].forEach(ch => ch.style.transitionDelay = (.05 * k) + 's');
  el.addEventListener('click', () => focusZone(l.zone.id));
  el.addEventListener('mouseenter', () => hotZone(l.zone.id)); el.addEventListener('mouseleave', () => hotZone(null));
  return new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat(l.centre);
});
let nums = [];
function showNums(l){
  nums.forEach(m => m.remove()); nums = [];
  if (!l) return;
  nums = l.graves.map(g => {
    const el = document.createElement('button'); el.type = 'button'; el.className = 'gn' + (g.rec ? ' rec' : ''); el.textContent = g.n;
    el.setAttribute('aria-label', `Open grave ${g.n}`);
    el.addEventListener('click', () => openGrave(l.zone, g.n));
    el.addEventListener('mouseenter', () => hotGrave(g.n)); el.addEventListener('mouseleave', () => hotGrave(null));
    el.dataset.n = g.n;
    return new maplibregl.Marker({ element: el, anchor: 'bottom', offset: [0, -6] }).setLngLat(g.at).addTo(map);
  });
  (l.trees || []).forEach(t => {
    const el = document.createElement('div'); el.className = 'tn glass'; el.textContent = t.name;
    nums.push(new maplibregl.Marker({ element: el, anchor: 'bottom', offset: [0, -110] }).setLngLat(t.at).addTo(map));
  });
}

/* camera */
const padding = () => mobile() ? { top: 110, bottom: 90, left: 30, right: 30 } : { top: 150, bottom: 110, left: 440, right: 80 };
function frame(bounds, opts){
  const cam = map.cameraForBounds(bounds, { padding: padding(), bearing: opts.bearing }) || {};
  return { center: cam.center || bounds.getCenter(), zoom: Math.min(opts.max || 21, (cam.zoom || 18) - (opts.less || 0)), bearing: opts.bearing, pitch: opts.pitch };
}
let current = null, bearing = -22, pending = null;
function focusZone(id){
  if (!document.body.classList.contains('landed')) { pending = id; return; }   // still flying in: go there once landed
  const l = L.find(x => x.zone.id === id) || null; current = l;
  document.querySelectorAll('#tabs button').forEach(b => {
    const on = b.dataset.z === (l ? l.zone.id : ''); b.setAttribute('aria-pressed', String(on));
    if (on) $('tabs').scrollTo({ left: b.offsetLeft - ($('tabs').clientWidth - b.offsetWidth) / 2, behavior: reduced ? 'auto' : 'smooth' });
  });
  history.replaceState(null, '', Archive.siteURL(site, l ? l.zone : null));
  L.forEach(x => { map.setFeatureState({ source: 'zones', id: x.i }, { on: x === l, dim: !!l && x !== l }); });
  document.body.classList.toggle('zoomed', !!l); setNav(l && l.zone);
  if (l) {
    showZone(l); showNums(l); prefetch(l);
    const b = new maplibregl.LngLatBounds(l.bounds[0], l.bounds[1]);
    map.flyTo({ ...frame(b, { bearing: map.getBearing(), pitch: 58, max: 21.6, less: .15 }), duration: reduced ? 0 : 1300, curve: 1.3, essential: true });
  } else {
    showZones(); showNums(null);
    map.flyTo({ ...frame(all, { bearing: map.getBearing(), pitch: 55, max: 20, less: .1 }), duration: reduced ? 0 : 1200, curve: 1.3, essential: true });
  }
}
/* while a zone is open, the grave page's viewer and the zone's scans download quietly, so a grave opens at once */
const VIEWER = ['grave.html', 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js', 'assets/models.js?v=5', 'assets/nav.js?v=5'];
const fetched = new Set();
function prefetch(l){
  const urls = VIEWER.concat(...l.zone.graves.map(g => Archive.scanFiles(site, l.zone, g).map(f => f.url)));
  urls.forEach(u => { if (fetched.has(u)) return; fetched.add(u);
    const k = document.createElement('link'); k.rel = 'prefetch'; k.href = u; document.head.appendChild(k); });
}
const closeUp = (at, b) => ({ center: at, zoom: 22.3, pitch: 72, bearing: b });   // pitch matches DIVE.pitch
/* the dive and the grave page's arrival are one move: the map camera speeds up as it drops and turns clockwise,
   the screen closes from the centre while it's still moving, and the grave page opens from the centre at the same
   angle, still turning the same way, and slows to a stop on the grave. DIVE is shared with grave.html via sessionStorage. */
const DIVE = { pitch: 72, turn: 40, ms: 1300, close: 820 };
const accel = t => t * t * (1.6 - .6 * t);   // gathers speed and is still moving at the cut
let leaving = false;
function openGrave(z, n){
  const g = Archive.grave(z, n); if (!g || leaving) return;
  const url = Archive.graveURL(site, z, g), l = L.find(x => x.zone === z), m = l && l.graves.find(x => x.n === n);
  if (reduced || !m) { location.href = url; return; }
  leaving = true; current = l; hotGrave(n);
  try { sessionStorage.setItem('ode:dive', JSON.stringify({ t: Date.now(), pitch: DIVE.pitch, turn: DIVE.turn })); } catch (e) {}
  document.body.classList.add('leaving');
  nums.forEach(k => k.getElement().classList.toggle('picked', +k.getElement().dataset.n === n));
  map.easeTo({ ...closeUp(m.at, map.getBearing() + DIVE.turn), duration: DIVE.ms, easing: accel, essential: true });
  setTimeout(() => document.body.classList.add('bloom-on'), DIVE.close);
  setTimeout(() => { location.href = url; }, DIVE.ms + 20);
}
// back from the grave page (bfcache): undo the dive
addEventListener('pageshow', e => { if (e.persisted && leaving) { leaving = false; document.body.classList.remove('leaving', 'bloom-on'); if (current) focusZone(current.zone.id); } });
document.getElementById('list').addEventListener('click', e => {
  const a = e.target.closest('a[data-n]'); if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button || !current || !map.loaded()) return;
  e.preventDefault(); openGrave(current.zone, +a.dataset.n);
});

/* hover, both ways between the map and the list */
let hz = null, hg = null;
function hotZone(id){
  if (hz !== null) map.setFeatureState({ source: 'zones', id: hz }, { hot: false });
  const l = L.find(x => x.zone.id === id); hz = l ? l.i : null;
  if (l) map.setFeatureState({ source: 'zones', id: l.i }, { hot: true });
  tags.forEach((t, k) => t.getElement().classList.toggle('hot', L[k].zone.id === id));
  document.querySelectorAll('#list button[data-z]').forEach(b => b.classList.toggle('hot', b.dataset.z === id));
  map.getCanvas().style.cursor = l ? 'pointer' : '';
}
function hotGrave(n){
  if (hg !== null) map.setFeatureState({ source: 'graves', id: hg }, { hot: false });
  const g = current && current.graves.find(x => x.n === n); hg = g ? g.id : null;
  if (g) map.setFeatureState({ source: 'graves', id: g.id }, { hot: true });
  nums.forEach(m => m.getElement().classList.toggle('hot', +m.getElement().dataset.n === n));
  document.querySelectorAll('#list a[data-n]').forEach(a => a.classList.toggle('hot', +a.dataset.n === n));
  map.getCanvas().style.cursor = g ? 'pointer' : '';
}
map.on('mousemove', e => {
  if (!map.getLayer('graves-3d')) return;
  const gf = current && map.queryRenderedFeatures(e.point, { layers: ['graves-3d'] }).find(f => f.properties.zone === current.zone.id);
  if (gf) { hotZone(null); hotGrave(gf.properties.n); return; }
  hotGrave(null);
  const zf = !current && map.queryRenderedFeatures(e.point, { layers: ['zone-fill'] })[0];
  hotZone(zf ? zf.properties.zone : null);
});
map.on('click', e => {
  if (!map.getLayer('graves-3d')) return;
  const gf = map.queryRenderedFeatures(e.point, { layers: ['graves-3d'] })[0];
  if (gf && current && gf.properties.zone === current.zone.id) { openGrave(current.zone, gf.properties.n); return; }
  const zf = map.queryRenderedFeatures(e.point, { layers: ['zone-fill'] })[0];
  if (zf && (!current || zf.properties.zone !== current.zone.id)) focusZone(zf.properties.zone);
});
map.on('move', () => { $('needle').style.transform = `rotate(${-map.getBearing()}deg)`; });
addEventListener('keydown', e => { if (e.key === 'Escape' && current) focusZone(''); });

/* the entry: a quick descent from the front page's view onto the site, then the zones light up */
showZones();
map.on('load', () => {
  clearTimeout(failTimer); addLayers(); addContext();
  if (window.SiteModel) SiteModel.add(map, site, c.dark, 'graves-3d');
  document.querySelectorAll('.maplibregl-ctrl-attrib').forEach(a => a.classList.remove('maplibregl-compact-show'));
  document.body.classList.add('ready');
  tags.forEach(t => t.addTo(map));
  const start = Archive.zone(site, P.zone);
  let from = null; try { from = JSON.parse(sessionStorage.getItem('ode:return') || 'null'); sessionStorage.removeItem('ode:return'); } catch (e) {}
  const sl = start && L.find(x => x.zone === start), back = from && sl && from.zone === start.id && Date.now() - from.t < 15000 && sl.graves.find(x => x.n === from.grave);
  if (back) {   // came back from that grave: start where the dive ended and rise out to the zone
    map.jumpTo(closeUp(back.at, bearing + 40)); document.body.classList.add('landed'); focusZone(start.id); return;
  }
  map.flyTo({ ...frame(all, { bearing, pitch: 55, max: 20, less: .1 }), duration: reduced ? 0 : 1600, curve: 1.2, essential: true });
  map.once('moveend', () => {
    document.body.classList.add('landed'); const go = pending !== null ? pending : start && start.id;
    if (go) setTimeout(() => focusZone(go), reduced ? 0 : 250);
  });
});
})();
</script>
</body>
</html>
